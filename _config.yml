# ==========================================================
#  Hexo 主配置文件
#  改完记得重启 hexo server
#  ★ 标记的地方是需要你填真实信息的位置
# ==========================================================

# ---------------- 网站 ----------------
title: 我的博客
subtitle: '记录与思考'
description: '写字的地方'
keywords:
author: qiiiq-Cys          # ★ 改成你的名字（会显示在文章作者、页脚版权处）
language: zh-CN
timezone: 'Asia/Shanghai'  # 中国时区，保证文章时间正确

# ---------------- 网址 ----------------
# 仓库名是 My_blog（普通仓库，不是 用户名.github.io），
# 所以博客地址带子路径 /My_blog/，root 必须写成 /My_blog/
# 仓库名或用户名变了，这两行要一起改，否则线上样式全丢。
url: https://qiiiq-Cys.github.io/My_blog
root: /My_blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ---------------- 目录 ----------------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---------------- 写作 ----------------
new_post_name: :year-:month-:day-:title.md   # 新建文章自动带日期前缀
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true      # 新建文章时自动建同名文件夹，放图片用
relative_link: false
future: true

# Markdown 渲染器（hexo-renderer-marked）
# postAsset 必须开！否则 ![](1.png) 会被解析成「站点根目录下的 1.png」而不是
# 「这篇文章自己的图片目录」，结果就是图片 404、网页上显示破图。
marked:
  prependRoot: true
  postAsset: true
  lazyload: false

highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# ---------------- 首页与分页 ----------------
index_generator:
  path: ''
  per_page: 10
  order_by: -date

per_page: 10
pagination_dir: page

# ---------------- 扩展 ----------------
theme: next

# ---------------- 部署 ----------------
# 仓库：qiiiq-Cys/My_blog，产物推送到 main 分支
deploy:
  type: git
  repo: https://github.com/qiiiq-Cys/My_blog.git
  branch: main
  # 不要在这里用 {{ now("...") }} 这类模板！
  # Windows 命令行会因里面的双引号把参数切断，导致提交信息变成
  # "Site updated: YYYY-11-2026年11月3日 20:09:38" 这种乱码。
  # 提交时间 git 自己会记，这里写固定文字即可。
  message: 'Site updated'
  # 必须显式允许隐藏文件！hexo-fs 复制目录时默认 ignoreHidden=true，
  # 会把 public/.nojekyll 静默丢掉，导致 GitHub Pages 又启用了 Jekyll
  ignore_hidden: false

# ---------------- 本地预览服务器 ----------------
# 默认端口 4000 落在 Windows 的保留端口段里（Hyper-V / WSL / Docker 会圈走
# 3952-4051 这一段），一启动就报 EACCES: permission denied。
# 换到 5000，这个端口不在保留段里。
server:
  port: 5000
  compress: false
  header: true

# ---------------- 其它 ----------------
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# ==========================================================
#  NexT 主题配置（覆盖 node_modules 里的默认值）
#  这个文件只写「要改的项」，其余沿用主题默认，升级主题不会冲突
#  ★ 标记的是需要填真实信息的位置
#  当前唯一待填：文件末尾的 twikoo.envId（步骤见《留言评论部署指南.md》）
# ==========================================================

# ---------------- 外观方案 ----------------
# 可选：Muse | Mist | Pisces | Gemini
# Gemini 是左右双栏，最常用
scheme: Gemini

# 深色模式开关（右上角会出现切换按钮）
darkmode: true

# ---------------- 自定义注入点 ----------------
# NexT 8 内置能力：把 source/_data/post-body-end.njk 插到文章正文末尾
# 用来放匿名评论区，不需要额外装 npm 插件，也不受主题升级影响
custom_file_path:
  postBodyEnd: source/_data/post-body-end.njk

# 代码块样式
codeblock:
  theme:
    light: default
    dark: stackoverflow-dark
  copy_button:
    enable: true

# ---------------- 导航菜单 ----------------
# 格式：路径 || 图标
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-layer-group
  about: /about/ || fa fa-user

menu_settings:
  icons: true
  badges: true   # 菜单上显示文章数量角标

# ---------------- 侧边栏 ----------------
sidebar:
  position: left
  display: post     # 只在文章页展开侧边栏

# 头像：把你的图片放到 source/images/ 下，然后写 /images/xxx.jpg
avatar:
  url: #/images/avatar.jpg
  rounded: true
  rotated: false

# 侧边栏显示文章/分类/标签数量
site_state: true

# ---------------- 社交链接 ----------------
social:
  GitHub: https://github.com/qiiiq-Cys || fab fa-github
  #E-Mail: mailto:you@example.com || fa fa-envelope

# ---------------- 文章目录 ----------------
toc:
  enable: true
  number: true
  wrap: false
  expand_all: false

# 阅读进度条（页面顶部一条彩色进度）
reading_progress:
  enable: true
  position: top

# 回到顶部按钮
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# ---------------- 本地搜索 ----------------
local_search:
  enable: true
  top_n_per_article: 1
  unescape: false
  preload: false

# ---------------- 首页摘要规则 ----------------
# 默认 true 时，NexT 会优先拿 front-matter 里的 description 当首页摘要，
# 导致文章里写的 <!-- more --> 完全失效。
# 改成 false 后，统一由 <!-- more --> 控制「首页显示到哪里」，
# description 只用于 SEO 和分享卡片，职责更清楚。
excerpt_description: false

# 摘要下面显示「阅读全文」按钮
read_more_btn: true

# ---------------- 页脚 ----------------
footer:
  since: 2026
  icon:
    name: fa fa-heart
    animated: true
    color: "#ff0000"

# ==========================================================
#  评论区已切换到 Twikoo（匿名、公开、能盖楼，访客不需要 GitHub 账号）
#  配置见文件末尾的 twikoo 段，部署步骤见《留言评论部署指南.md》
#
#  【旧】utterances：原理是「每条评论 = 仓库里的一个 Issue」，
#        访客必须用 GitHub 账号授权，没账号的人留不了言，故已关闭。
#        配置完整保留：想切回来就把 enable 改成 true，
#        同时把 twikoo.envId 清空，避免两套评论区同时出现。
# ==========================================================
utterances:
  enable: false

  # 仓库名：只有切回 utterances 时才需要确认这行
  # 这个仓库必须是 public，并且要装过 utterances 的 GitHub App（见部署说明第 4 步）
  # 建议就用博客仓库本身，issues 都集中在同一个地方好管理
  repo: qiiiq-Cys/My_blog

  # 用文章的什么信息去匹配 Issue：
  #   pathname        -> 用网址路径，改标题不影响（推荐）
  #   url             -> 用完整网址，换域名会断
  #   title           -> 用文章标题，改标题会导致评论丢失
  issue_term: pathname

  # 主题：github-light / github-dark / preferred-color-scheme（跟随系统）
  # 注意：这里设成 github-light，是因为它和 NexT 的浅色模式最搭；
  #       想跟随系统就改成 preferred-color-scheme
  theme: github-light

# ==========================================================
#  评论区：Twikoo（匿名、公开、可回复，访客不需要任何账号）
#  ★ 唯一要你填的：envId —— 部署好云函数后拿到的地址或环境 ID
#    步骤见《留言评论部署指南.md》第 1~3 步
#    留空 = 不注入任何评论框，线上不会出现坏掉的评论区
#    填好后执行 npm run publish 即生效
#  Vercel：填根地址，如 https://xxx.vercel.app
#  Netlify：必须带完整函数路径，如 https://xxx.netlify.app/.netlify/functions/twikoo
#  腾讯云 CloudBase：填纯环境 ID，如 twikoo-xxxxxxxx
# ==========================================================
twikoo:
  envId:
